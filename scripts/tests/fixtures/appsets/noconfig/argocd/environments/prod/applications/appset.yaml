apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
          - git:
              repoURL: https://github.com/maxim-grin/homelab.git
              revision: main
              files:
                - path: argocd/apps/*/config.yaml
  template:
    metadata:
      name: "{{.name}}-{{.path.basename}}"
    spec:
      project: homelab
      source:
        repoURL: https://github.com/maxim-grin/homelab.git
        targetRevision: main
        path: "argocd/apps/{{.path.basename}}/{{.metadata.labels.env}}"
        plugin:
          name: argocd-vault-plugin
      destination:
        name: "{{.name}}"
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
