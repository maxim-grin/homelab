apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs
  namespace: argocd
  annotations:
    # Wave 0: the nfs-prod StorageClass (the default) must exist before any
    # PVC in a later wave.
    argocd.argoproj.io/sync-wave: "0"
  # No resources-finalizer: this app is being rolled into the ApplicationSet
  # (ADR 0026), and root-prod's prune must delete only the Application, not
  # the workloads it runs. root-prod's selfHeal puts back a finalizer that is
  # removed by hand, so it has to be absent here, in git.
spec:
  project: homelab
  source:
    repoURL: https://github.com/maxim-grin/homelab.git
    targetRevision: main
    path: argocd/apps/nfs-provisioner/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: nfs-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
