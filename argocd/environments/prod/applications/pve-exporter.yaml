apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pve-exporter
  namespace: argocd
  annotations:
    # Wave 6: the ServiceMonitor CRD arrives with the monitoring chart
    # (wave 5) and the namespace with monitoring-secrets (wave 4).
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  source:
    repoURL: https://github.com/maxim-grin/homelab.git
    targetRevision: main
    path: argocd/apps/pve-exporter/prod
    # The API token and the Proxmox address are <path:...> placeholders;
    # AVP resolves them against Vault (kv-prod) at sync time.
    plugin:
      name: argocd-vault-plugin
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # No CreateNamespace: monitoring-secrets owns the Namespace and its
  # Pod Security label.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # ArgoCD here has no Application health check, so sync waves only order
    # creation, they do not wait for the chart to be ready. This sync can
    # run before the ServiceMonitor CRD or the namespace exist, and a
    # failed automated sync is not retried without this.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      # Client-side apply would copy the AVP-rendered Secret, token and
      # all, into the last-applied-configuration annotation in clear text.
      # Server-side apply keeps no such copy.
      - ServerSideApply=true
