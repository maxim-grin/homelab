apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alerts
  namespace: argocd
  annotations:
    # Wave 6: the PodMonitor and PrometheusRule CRDs arrive with the
    # monitoring chart (wave 5) and the namespace with monitoring-secrets
    # (wave 4).
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  source:
    repoURL: https://github.com/maxim-grin/homelab.git
    targetRevision: main
    path: argocd/apps/alerts/prod
    # Plain kustomize, no AVP plugin: nothing here is a secret.
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # No CreateNamespace: monitoring-secrets owns the Namespace and its
  # Pod Security label.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # ArgoCD here has no Application health check, so sync waves only order
    # creation, they do not wait for the chart to be ready. This sync can
    # run before the PodMonitor and PrometheusRule CRDs or the namespace
    # exist, and a failed automated sync is not retried without this.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      # A PrometheusRule's long rule strings would otherwise be copied
      # into the last-applied-configuration annotation, which counts
      # against the 256 KiB annotation limit; server-side apply keeps no
      # such copy. Same option as the other prod Applications.
      - ServerSideApply=true
