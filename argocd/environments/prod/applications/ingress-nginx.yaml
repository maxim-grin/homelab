apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    # Wave 3: last of the platform apps; Ingresses elsewhere need it.
    argocd.argoproj.io/sync-wave: "3"
  # No resources-finalizer: this app is being rolled into the ApplicationSet
  # (ADR 0026), and root-prod's prune must delete only the Application, not
  # the workloads it runs. root-prod's selfHeal puts back a finalizer that is
  # removed by hand, so it has to be absent here, in git.
spec:
  project: homelab
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: 4.14.5
      helm:
        releaseName: ingress-nginx
        valueFiles:
          - $values/argocd/apps/ingress-nginx/prod/values.yaml
    - repoURL: https://github.com/maxim-grin/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The chart's admission webhook is created by a Job that must finish
      # before any Ingress can be admitted. Without ServerSideApply the
      # webhook configuration and its CA bundle race on resync.
      - ServerSideApply=true
    # Talos enforces Pod Security `baseline` cluster-wide, which rejects
    # hostPort. The controller binds host ports 80/443, so this namespace
    # alone is labelled `privileged`. No other namespace needs it.
    # This key belongs under syncPolicy: one level up it is silently
    # ignored, the namespace stays unlabelled and the DaemonSet's pods are
    # refused at admission.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
