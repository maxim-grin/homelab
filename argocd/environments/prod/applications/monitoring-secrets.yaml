apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-secrets
  namespace: argocd
  annotations:
    # Wave 4: the namespace and the Secrets the chart in wave 5 reads.
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  source:
    repoURL: https://github.com/maxim-grin/homelab.git
    targetRevision: main
    path: argocd/apps/monitoring-secrets/prod
    # The Grafana admin login and the Telegram token and chat id are
    # <path:...> placeholders; AVP resolves them against Vault (kv-prod)
    # at sync time.
    plugin:
      name: argocd-vault-plugin
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # Separate from the chart Application because the chart is a Helm
  # source without AVP, and no placeholder may sit in its values file.
  # No CreateNamespace: the Namespace is a manifest in this app, with
  # its Pod Security label.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Client-side apply would copy the AVP-rendered Secrets, credentials
      # and all, into the last-applied-configuration annotation in clear
      # text. Server-side apply keeps no such copy.
      - ServerSideApply=true
