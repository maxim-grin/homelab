apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-issuers
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  source:
    repoURL: https://github.com/maxim-grin/homelab.git
    targetRevision: main
    path: argocd/apps/cert-manager-issuers/dev
    # The Cloudflare token is a <path:...> placeholder; AVP resolves it
    # against Vault at sync time.
    plugin:
      name: argocd-vault-plugin
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  # Separate from the cert-manager Application on purpose. That one is a
  # Helm release of an upstream chart; this is our own configuration of
  # it, and the ClusterIssuers here outlive any particular consumer --
  # jobboard is the first, not the only. Keeping them apart also means a
  # chart upgrade and an issuer change are separate diffs.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Same reason jobboard sets it: client-side apply stores the manifest
      # it sent in kubectl.kubernetes.io/last-applied-configuration, and for
      # a Secret that manifest is the one AVP rendered -- so the Cloudflare
      # token would sit in clear text in an annotation, readable without
      # even decoding .data. Server-side apply tracks field ownership in
      # managedFields and keeps no such copy.
      - ServerSideApply=true
