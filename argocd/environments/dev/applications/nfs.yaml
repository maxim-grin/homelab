apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs
  namespace: argocd
spec:
  project: homelab
  source:
    repoURL: https://github.com/maxim-grin/homelab.git
    targetRevision: main
    path: argocd/apps/nfs-provisioner/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: nfs-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
