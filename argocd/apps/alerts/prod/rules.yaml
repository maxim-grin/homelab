# Alert rules the kube-prometheus-stack chart does not ship. Its default
# rules already cover node not ready (KubeNodeNotReady) and crash-looping
# pods (KubePodCrashLooping), so they are not repeated here: a second
# copy would only send every such alert twice.
#
# Cluster-agnostic on purpose: no `cluster` label value and no namespace
# is pinned except where a rule is about one specific workload
# (cert-manager, the NFS provisioner, ingress-nginx). When sub-project 4
# brings dev's metrics here, these rules cover them without a rewrite.
#
# Severity follows the chart's convention, which the Alertmanager route in
# monitoring-secrets reads: `critical` is a page, `warning` a ticket.
#
# Open selectors on the monitoring chart (ruleSelector: {}) pick these up
# without a release label.
#
# Pending: a thin-pool `data%` above 80% rule over the pve-exporter
# `local-lvm` series (expected pve_disk_size_bytes / pve_disk_usage_bytes,
# unconfirmed) waits for the operator to observe the series on the live
# Prometheus.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alerts
spec:
  groups:
    - name: cert-manager
      rules:
        # cert-manager renews a Let's Encrypt certificate 30 days before
        # it expires, so one still inside 14 days means renewal has been
        # failing for two weeks.
        - alert: CertificateExpiringSoon
          expr: |
            certmanager_certificate_expiration_timestamp_seconds - time()
              < 14 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Certificate {{ $labels.namespace }}/{{ $labels.name }} expires within 14 days
            description: >-
              Certificate {{ $labels.namespace }}/{{ $labels.name }}
              (issuer {{ $labels.issuer_name }}) expires in
              {{ $value | humanizeDuration }} and has not been renewed.
            runbook: >-
              kubectl -n {{ $labels.namespace }} describe certificate
              {{ $labels.name }}, then its CertificateRequest and Order.
              Debug against letsencrypt-staging: production allows 5
              failed validations per hostname per hour.
        # Unknown is included: a Certificate stuck mid-issuance never
        # reaches False. DNS-01 takes minutes, hence the 15m.
        - alert: CertificateNotReady
          expr: |
            certmanager_certificate_ready_status{condition=~"False|Unknown"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Certificate {{ $labels.namespace }}/{{ $labels.name }} is not ready
            description: >-
              Certificate {{ $labels.namespace }}/{{ $labels.name }} has
              had Ready={{ $labels.condition }} for 15 minutes; the
              Ingress using it serves an old or missing certificate.
            runbook: >-
              kubectl -n {{ $labels.namespace }} describe certificate
              {{ $labels.name }}; for DNS-01, check the Cloudflare token
              in Vault and the issuer's status.

    - name: nfs-provisioner
      rules:
        # The chart's KubeDeploymentReplicasMismatch would also catch
        # this, generically and after 15 minutes. This one names the
        # consequence. Existing volumes stay mounted; only new PVCs on
        # nfs-dev / nfs-prod sit Pending, and the apps above them read
        # as broken for unrelated reasons. The regex covers prod's
        # -prod and dev's -dev Deployment.
        - alert: NfsProvisionerUnavailable
          expr: |
            kube_deployment_status_replicas_available{namespace="nfs-system", deployment=~"nfs-client-provisioner.*"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: NFS provisioner {{ $labels.deployment }} has no available replica
            description: >-
              {{ $labels.deployment }} in nfs-system has had no available
              replica for 5 minutes. New PVCs on its StorageClass stay
              Pending until it is back.
            runbook: >-
              kubectl -n nfs-system describe deployment
              {{ $labels.deployment }}; if the pod cannot mount, check
              the export on nfs-01 with showmount -e.

    - name: prometheus-storage
      rules:
        # Against the TSDB's own block bytes, not kubelet_volume_stats_*:
        # on an nfs-subdir PV the kubelet reports the whole nfs-prod
        # share's filesystem, not the 20Gi claim.
        #
        # 15 * 2^30 is prod's `retentionSize: 15GB` (kube-prometheus-stack
        # values). Prometheus reads that unit as base 2, so 15GB is 15 GiB,
        # 16106127360 bytes; this alerts at 90%, about 13.5 GiB. Change
        # both together. Retention deletes the oldest blocks at the cap, so
        # this firing means size, not the 10d time limit, now decides how
        # much history is kept.
        - alert: PrometheusStorageNearRetentionSize
          expr: |
            prometheus_tsdb_storage_blocks_bytes > 0.9 * 15 * 2^30
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Prometheus {{ $labels.pod }} TSDB above 90% of its 15 GiB retention size
            description: >-
              Prometheus {{ $labels.namespace }}/{{ $labels.pod }} holds
              {{ $value | humanize1024 }}B of blocks. Size-based retention
              is about to delete history younger than the 10 day limit.
            runbook: >-
              Find the series growing fastest (topk over
              scrape_series_added) and drop them, or raise retentionSize
              and the 20Gi claim together.
---
# Ingress availability SLO: 99% of requests answered without a 5xx over
# 30 days, so the error budget is 1%. Multi-window, multi-burn-rate alerts
# (the Google SRE workbook's): a page when the budget burns 14.4x too fast
# over both 1h and 5m (2% of the month's budget in an hour), a ticket at
# 6x over both 6h and 30m (5% in six hours). The long window proves the
# burn is real; the short one makes the alert resolve soon after it stops.
#
# The source is ingress-nginx's nginx_ingress_controller_requests counter,
# labelled per request with `status` (the HTTP code, or `5xx` with
# --report-status-classes; the regex matches both), `namespace` and
# `ingress` of the Ingress that served it, and `host` while
# --metrics-per-host is on (the default). Ratios are per Ingress.
#
# Zero traffic: the denominator keeps only Ingresses with requests in the
# window (`> 0`), so an idle one yields no ratio at all, rather than 0/0,
# and cannot fire. An Ingress with traffic but no 5xx series yet gets its
# total times 0 as the numerator, an explicit 0 with the same labels.
# `or vector(0)` would not do here: it carries no labels, so it would match
# no Ingress in the division.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ingress-slo
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alerts
spec:
  groups:
    - name: ingress-slo-recording
      rules:
        - record: ingress:request_error_ratio:rate5m
          expr: |
            (
                sum by (cluster, namespace, ingress) (rate(nginx_ingress_controller_requests{ingress!="", status=~"5.."}[5m]))
              or
                sum by (cluster, namespace, ingress) (rate(nginx_ingress_controller_requests{ingress!=""}[5m])) * 0
            )
            /
            (sum by (cluster, namespace, ingress) (rate(nginx_ingress_controller_requests{ingress!=""}[5m])) > 0)
        - record: ingress:request_error_ratio:rate30m
          expr: |
            (
                sum by (cluster, namespace, ingress) (rate(nginx_ingress_controller_requests{ingress!="", status=~"5.."}[30m]))
              or
                sum by (cluster, namespace, ingress) (rate(nginx_ingress_controller_requests{ingress!=""}[30m])) * 0
            )
            /
            (sum by (cluster, namespace, ingress) (rate(nginx_ingress_controller_requests{ingress!=""}[30m])) > 0)
        - record: ingress:request_error_ratio:rate1h
          expr: |
            (
                sum by (cluster, namespace, ingress) (rate(nginx_ingress_controller_requests{ingress!="", status=~"5.."}[1h]))
              or
                sum by (cluster, namespace, ingress) (rate(nginx_ingress_controller_requests{ingress!=""}[1h])) * 0
            )
            /
            (sum by (cluster, namespace, ingress) (rate(nginx_ingress_controller_requests{ingress!=""}[1h])) > 0)
        - record: ingress:request_error_ratio:rate6h
          expr: |
            (
                sum by (cluster, namespace, ingress) (rate(nginx_ingress_controller_requests{ingress!="", status=~"5.."}[6h]))
              or
                sum by (cluster, namespace, ingress) (rate(nginx_ingress_controller_requests{ingress!=""}[6h])) * 0
            )
            /
            (sum by (cluster, namespace, ingress) (rate(nginx_ingress_controller_requests{ingress!=""}[6h])) > 0)

    - name: ingress-slo-alerts
      rules:
        # 14.4 * 0.01 = 0.144: 14.4x the 1% budget.
        - alert: IngressErrorBudgetBurnFast
          expr: |
            ingress:request_error_ratio:rate1h > 14.4 * 0.01
            and
            ingress:request_error_ratio:rate5m > 14.4 * 0.01
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Ingress {{ $labels.namespace }}/{{ $labels.ingress }} is burning its error budget fast
            description: >-
              {{ $value | humanizePercentage }} of requests to
              {{ $labels.namespace }}/{{ $labels.ingress }} returned 5xx
              over the last hour (budget 1%). At this rate the 30-day
              budget is gone in about two days.
            runbook: >-
              kubectl -n {{ $labels.namespace }} get pods,endpoints;
              a 502/503 with no endpoints means the backend is down,
              not ingress-nginx.
        # 6 * 0.01 = 0.06: 6x the 1% budget.
        - alert: IngressErrorBudgetBurnSlow
          expr: |
            ingress:request_error_ratio:rate6h > 6 * 0.01
            and
            ingress:request_error_ratio:rate30m > 6 * 0.01
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Ingress {{ $labels.namespace }}/{{ $labels.ingress }} is burning its error budget
            description: >-
              {{ $value | humanizePercentage }} of requests to
              {{ $labels.namespace }}/{{ $labels.ingress }} returned 5xx
              over the last 6 hours (budget 1%). At this rate the 30-day
              budget is gone in five days.
            runbook: >-
              Look for a backend that restarts or times out under load:
              kubectl -n {{ $labels.namespace }} get pods, then its logs.
