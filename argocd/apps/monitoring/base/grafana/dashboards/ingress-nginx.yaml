apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ingress-nginx
  namespace: monitoring
data:
  ingress-nginx.json: |
    {
      "id": null,
      "uid": "ingress-nginx",
      "title": "ingress-nginx",
      "tags": ["homelab", "ingress-nginx"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Request rate by ingress",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps", "min": 0}, "overrides": []},
          "targets": [
            {
              "expr": "sum by (ingress) (rate(nginx_ingress_controller_requests[5m]))",
              "legendFormat": "{{ingress}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Status code class rate",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps", "min": 0}, "overrides": []},
          "targets": [
            {
              "expr": "sum by (status) (rate(nginx_ingress_controller_requests[5m]))",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Request latency (p50 / p95)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s", "min": 0}, "overrides": []},
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (ingress, le) (rate(nginx_ingress_controller_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{ingress}} p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (ingress, le) (rate(nginx_ingress_controller_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{ingress}} p95",
              "refId": "B"
            }
          ]
        }
      ]
    }
