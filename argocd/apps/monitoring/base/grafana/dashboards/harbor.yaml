apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-harbor
  namespace: monitoring
data:
  harbor.json: |
    {
      "id": null,
      "uid": "harbor",
      "title": "Harbor",
      "tags": ["homelab", "harbor"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Component up",
          "type": "stat",
          "gridPos": {"h": 6, "w": 24, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "description": "Only universal Go-runtime metrics below (process/goroutine/GC) -- harbor-exporter and harbor-core's own custom metric names weren't verifiable from this environment (no reachable source for the chart's metrics.go). Add request-rate/error panels once someone checks a live target's /metrics output and confirms the real metric names.",
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {"type": "value", "options": {"1": {"text": "up", "color": "green"}}},
                {"type": "value", "options": {"0": {"text": "down", "color": "red"}}}
              ]
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "up{job=\"harbor\"}",
              "legendFormat": "{{component}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Process CPU",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0}, "overrides": []},
          "targets": [
            {
              "expr": "rate(process_cpu_seconds_total{job=\"harbor\"}[5m])",
              "legendFormat": "{{component}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Resident memory",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "bytes", "min": 0}, "overrides": []},
          "targets": [
            {
              "expr": "process_resident_memory_bytes{job=\"harbor\"}",
              "legendFormat": "{{component}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Goroutines",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 14},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []},
          "targets": [
            {
              "expr": "go_goroutines{job=\"harbor\"}",
              "legendFormat": "{{component}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
