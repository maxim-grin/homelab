# Grafana builds redirects and asset paths from GF_SERVER_ROOT_URL rather than
# from the request. Left unset it defaults to http://localhost:3000, so
# logging in bounces the browser to localhost and the session never lands.
# https:// because the Ingress now terminates TLS: ingress-nginx redirects
# HTTP to HTTPS for a host with a certificate, so an http:// root URL sends
# every redirect through a 308 and breaks OAuth-style return paths outright.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  template:
    spec:
      containers:
        - name: grafana
          env:
            - name: GF_SERVER_ROOT_URL
              value: "https://grafana.mgryn.cc"
