apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - ../base
  - grafana-ingress.yaml
  - prometheus-ingress.yaml

# patchesStrategicMerge is deprecated in current kustomize but still works and
# is what this overlay already used; migrating it is a separate change.
patchesStrategicMerge:
  - grafana-pvc-dev.yaml
  - prometheus-pvc-dev.yaml
  - grafana-rooturl-dev.yaml
