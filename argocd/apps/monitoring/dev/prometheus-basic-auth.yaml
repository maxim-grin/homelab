# The htpasswd line comes from Vault at sync time via argocd-vault-plugin;
# the placeholder below is not a secret and this file is committed to a
# public repository on purpose. ingress-nginx reads the `auth` key.
#
# Create the value once (bcrypt, never the plain password) and seed it
# through secret.yaml's vault_kv block -- see secret.yaml.example:
#   printf '%s:%s' prometheus "$(argocd account bcrypt --password '<password>')"
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-basic-auth
  namespace: monitoring
  annotations:
    # Server-side apply for this Secret alone. Client-side apply would copy
    # the rendered manifest -- hash included -- into a last-applied
    # annotation anyone with `get secret` can read. Setting it here rather
    # than on the whole Application leaves every other monitoring object
    # on the apply method it was created with.
    argocd.argoproj.io/sync-options: ServerSideApply=true
type: Opaque
stringData:
  auth: <path:kv-dev/data/monitoring/prometheus#auth>
