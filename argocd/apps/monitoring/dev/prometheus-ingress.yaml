apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: monitoring
  annotations:
    # Prometheus ships no authentication of its own, so ingress-nginx
    # asks for it. The htpasswd line is the prometheus-basic-auth Secret
    # (from Vault, see prometheus-basic-auth.yaml). This guards the name
    # only: Grafana reaches Prometheus in-cluster at http://prometheus:9090
    # and never passes through here, and a NodePort, if one were added,
    # would bypass it.
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: prometheus-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Prometheus"
spec:
  # Without authentication anyone who can reach this name could read every
  # metric -- host names, addresses, pod labels -- so the annotations above
  # are what keep it a LAN page.
  #
  # The deployment passes only --config.file, --storage.tsdb.path and
  # --storage.tsdb.retention.time: without --web.enable-admin-api or
  # --web.enable-lifecycle there is no delete-series endpoint and no remote
  # reload, so this is read-only. Adding either of those flags later turns
  # this Ingress into a destructive API on the LAN.
  ingressClassName: nginx
  rules:
    - host: prometheus.mgryn.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
