expose:
  type: ingress
  tls:
    enabled: false
  ingress:
    hosts:
      core: harbor.mgryn.cc
    className: nginx
    annotations:
      kubernetes.io/ingress.class: nginx

# No port: ingress-nginx binds 80 on each node via hostPort, so the
# hostname alone reaches harbor once DNS points at a node. The :31529
# here predated any working ingress controller.
externalURL: http://harbor.mgryn.cc
namespaceOverride: harbor

# Every credential below comes from the `harbor-secrets` Secret, created out
# of band by `ansible-playbook playbooks/cluster_secrets.yaml`. This
# repository is public, so no value can be committed -- only the Secret's
# name, which is not sensitive.
#
# Two separate reasons these are all pinned:
#
# 1. Defaults. harborAdminPassword ships as "Harbor12345" and secretKey as
#    the literal string "not-a-secure-key" -- identical on every Harbor
#    install in the world. secretKey encrypts the credentials Harbor stores
#    in its own database.
#
# 2. ArgoCD regenerates anything Helm generates. The chart guards its
#    generated secrets with `lookup`, which reads the live Secret from the
#    cluster -- but ArgoCD renders with `helm template`, which has no cluster
#    access, so `lookup` always returns empty and every render falls through
#    to `randAlphaNum`. core.secret, core.xsrfKey, jobservice.secret,
#    registry.secret and the registry htpasswd would each get a fresh value
#    on every sync, leaving Harbor permanently OutOfSync and rewriting its
#    own auth underneath itself.
#
# database.internal.password is deliberately NOT here: the chart offers
# existingSecret only for database.external, so the only way to change it is
# to commit it, and a password published in a public repository is no better
# than the well-known default. Harbor's Postgres is ClusterIP with no
# ingress.
existingSecretAdminPassword: harbor-secrets
existingSecretSecretKey: harbor-secrets

chartmuseum:
  enabled: false

clair:
  enabled: false

notary:
  enabled: false

trivy:
  enabled: false

jobservice:
  replicas: 1
  # key `JOBSERVICE_SECRET`, 16 chars
  existingSecret: harbor-secrets

resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

# Component-specific resources
portal:
  replicas: 1
  healthCheck:
    periodSeconds: 120
    timeoutSeconds: 30
    initialDelaySeconds: 30
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

core:
  replicas: 1
  # key `secret` (16 chars) and key `CSRF_KEY` (32 chars)
  existingSecret: harbor-secrets
  existingXsrfSecret: harbor-secrets
  healthCheck:
    periodSeconds: 120
    timeoutSeconds: 30
    initialDelaySeconds: 30
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

registry:
  replicas: 1
  # key `REGISTRY_HTTP_SECRET`, 16 chars
  existingSecret: harbor-secrets
  credentials:
    # keys `REGISTRY_PASSWD` and `REGISTRY_HTPASSWD`. The htpasswd value is
    # "user:hash" and the hash must be $2a$ or $2b$ -- the registry uses Go's
    # bcrypt, which rejects the $2y$ that htpasswd(1) emits.
    existingSecret: harbor-secrets
  healthCheck:
    periodSeconds: 120
    timeoutSeconds: 30
    initialDelaySeconds: 30
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

database:
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "250m"
    limits:
      memory: "256Mi"
      cpu: "500m"

redis:
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

persistence:
  enabled: true
  imageChartStorage:
    type: filesystem
    filesystem:
      rootdirectory: /storage
  persistentVolumeClaim:
    registry:
      storageClass: nfs-dev
      accessMode: ReadWriteMany
      size: 10Gi
    jobservice:
      jobLog:
        storageClass: nfs-dev
        accessMode: ReadWriteOnce
        size: 1Gi
    database:
      storageClass: nfs-dev
      accessMode: ReadWriteOnce
      size: 1Gi
    redis:
      storageClass: nfs-dev
      accessMode: ReadWriteOnce
      size: 500Mi

affinity: {}
logLevel: warn
gc:
  schedule: "0 2 * * *"
