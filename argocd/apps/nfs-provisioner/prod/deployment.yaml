# NFS_SERVER and the volume's server/path are literal because ArgoCD renders
# from git and the volume's nfs.server takes no ConfigMap reference. 10.0.0.131
# is nfs-01 (the same server dev uses; RFC1918, so nothing routable is
# exposed). /srv/nfs/prod is its prod share, exported only to the two
# prod workers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-client-provisioner-prod
  namespace: nfs-system
  labels:
    app: nfs-client-provisioner
    environment: prod
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nfs-client-provisioner
      environment: prod
  template:
    metadata:
      labels:
        app: nfs-client-provisioner
        environment: prod
    spec:
      serviceAccountName: nfs-client-provisioner
      containers:
        - name: nfs-client-provisioner
          image: registry.k8s.io/sig-storage/nfs-subdir-external-provisioner:v4.0.2
          volumeMounts:
            - name: nfs-client-root
              mountPath: /persistentvolumes
          env:
            - name: PROVISIONER_NAME
              value: nfs-prod
            - name: NFS_SERVER
              value: 10.0.0.131
            - name: NFS_PATH
              value: /srv/nfs/prod
      volumes:
        - name: nfs-client-root
          nfs:
            server: 10.0.0.131
            path: /srv/nfs/prod
