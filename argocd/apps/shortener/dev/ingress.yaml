apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shortener
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dev-s.mgryn.cc
      secretName: shortener-tls
  rules:
    - host: dev-s.mgryn.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shortener
                port:
                  number: 80
