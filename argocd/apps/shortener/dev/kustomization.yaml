apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shortener

resources:
  - ../base
  - ingress.yaml

# Bumped by hand after the app repo cuts a v<version> tag. Quoted so it stays a string.
images:
  - name: ghcr.io/maxim-grin/multi-short-url
    newTag: "0.1.0"

patches:
  - target:
      kind: PersistentVolumeClaim
      name: shortener-data
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: nfs-dev
  - target:
      kind: Deployment
      name: shortener
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SHORTENER_BASE_URL
          value: https://dev-s.mgryn.cc
