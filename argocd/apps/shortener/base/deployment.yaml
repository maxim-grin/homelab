apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortener
spec:
  # One replica, and Recreate: the store is one SQLite file, so two pods
  # must never have it open at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shortener
  template:
    metadata:
      labels:
        app: shortener
    spec:
      # The image runs as uid 10001; fsGroup makes the volume writable for it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shortener
          # The overlay's `images:` sets the version; the repo holds one version string.
          image: ghcr.io/maxim-grin/multi-short-url
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SHORTENER_PREFIX
              value: homelab
            # The overlay sets SHORTENER_BASE_URL to its public address.
          # /healthz does not touch the store, so a store fault cannot restart-loop the pod.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shortener-data
