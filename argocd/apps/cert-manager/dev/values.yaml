# cert-manager for the dev cluster.
#
# Here to put a real, publicly trusted certificate on jobs.mgryn.cc without
# exposing the cluster. mgryn.cc's Cloudflare certificate cannot help: it
# terminates at Cloudflare's edge, and jobs.mgryn.cc resolves to 10.0.0.101,
# so that traffic never reaches the edge to be terminated there.
#
# The ACME HTTP-01 challenge is equally useless here -- it requires Let's
# Encrypt to reach the host from the public internet, and nothing about this
# cluster is reachable from outside. DNS-01 proves control of the domain by
# writing a TXT record instead, which a machine on a private address can do
# perfectly well. That is the whole reason this is possible at all.

# The CRDs ship with the chart rather than being applied separately. Argo
# prunes what it installs, so splitting them across two Applications means a
# resync of one can delete resources the other still owns; keeping them in
# this release makes cert-manager a single unit to install or remove.
crds:
  enabled: true

# Leave the DNS-01 propagation check on its default, which asks the zone's
# authoritative servers. Pinning it to recursive resolvers
# (--dns01-recursive-nameservers-only) stalled issuance for half an hour once:
# they cache the NODATA from before the challenge record exists,
# and mgryn.cc's SOA sets a 1800s negative TTL.

# Single-node bare metal; the chart's defaults assume more headroom than
# this box has and nothing here is latency-sensitive.
resources:
  requests:
    cpu: 10m
    memory: 32Mi

# No `metrics`/`podAnnotations` block here on purpose. The chart already
# puts prometheus.io/scrape, /port and /path annotations on the
# controller pod by default (prometheus.enabled: true, with neither
# podmonitor nor servicemonitor enabled -- verified against
# templates/deployment.yaml) -- the monitoring stack's
# 'kubernetes-pods' scrape job already picks it up with zero config here.
# Careful if this ever needs a `podAnnotations` override for something
# else: the chart's own template only adds its prometheus.io annotations
# when `.Values.podAnnotations` is unset, so setting one for an unrelated
# reason would silently turn this off.
