# Where the set `apps` (argocd/environments/prod/applications/appset.yaml)
# deploys this app: one list entry per env, each generating
# `<cluster>-<dir>` from argocd/apps/<dir>/<env>. `[]` would deploy it
# nowhere. Rolled in on 2026-10-09 (uniform-rollout-4b).
#
# Ordering: after monitoring-secrets, which creates the `monitoring`
# namespace and the Secrets this chart references by name; before alerts
# and pve-exporter, which need its CRDs.
# Generated Applications all start at once (the set creates them, so sync
# waves order nothing). The set's retry (limit 10, backoff 30s x2, max
# 5m: about 37 minutes) carries a sync that runs before its dependency is
# ready; after that, sync the app by hand.
#
- env: prod
  namespace: monitoring
  # No CreateNamespace and no namespaceLabels: monitoring-secrets owns
  # the namespace and its privileged Pod Security label, and two owners
  # would fight over the labels.
  createNamespace: false
  # The operator's CRDs (Prometheus, Alertmanager) are larger than the
  # 256KiB last-applied-configuration annotation client-side apply
  # writes, so a plain apply fails with "metadata.annotations: Too
  # long". Server-side apply keeps no such annotation.
  serverSideApply: true
- env: dev
  namespace: monitoring
  # monitoring-secrets owns the namespace, as on prod.
  createNamespace: false
  # The operator's CRDs exceed the 256KiB last-applied-configuration
  # annotation, as on prod; carried over from dev's old Application.
  serverSideApply: true
