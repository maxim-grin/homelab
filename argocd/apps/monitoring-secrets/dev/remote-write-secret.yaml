# Basic-auth login the dev Prometheus presents to the hub's remote-write
# receiver (prometheus.mgryn.cc, prod's prometheus-basic-auth htpasswd).
# Rendered by argocd-vault-plugin at sync time; the placeholders are not
# secrets.
#
# Operator seeds, once: kv-dev/monitoring/remote-write fields `username`
# and `password`; the matching bcrypt line is kv-prod's `htpasswd`.
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-remote-write
  namespace: monitoring
  annotations:
    # Server-side apply: client-side apply would copy the credentials
    # into a last-applied annotation readable with `get secret`.
    argocd.argoproj.io/sync-options: ServerSideApply=true
type: Opaque
stringData:
  username: <path:kv-dev/data/monitoring/remote-write#username>
  password: <path:kv-dev/data/monitoring/remote-write#password>
