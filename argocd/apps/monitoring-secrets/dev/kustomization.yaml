apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The monitoring namespace and the remote-write credentials Secret the
# dev Prometheus (agent mode) reads. AVP resolves the <path:...>
# placeholder against Vault (kv-dev) at sync time.
#
# No `namespace:` transformer: each resource names its own namespace,
# and the transformer would also rewrite the Namespace object.
resources:
  - namespace.yaml
  - remote-write-secret.yaml
