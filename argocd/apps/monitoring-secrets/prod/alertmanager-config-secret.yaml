# The whole Alertmanager configuration, mounted through the chart's
# alertmanager.alertmanagerSpec.configSecret. It lives here rather than
# in the chart values because it carries two credentials, and no
# <path:...> placeholder may sit in a Helm values file.
#
# Why the whole config and not just a token file: Telegram's `chat_id`
# is an integer in Alertmanager's config and has no `_file` variant.
# AVP replaces the placeholder text inside the string below *before*
# Alertmanager parses that string as YAML, so `chat_id: <path:...>`
# becomes `chat_id: -100123...`, a bare integer. Leave it unquoted:
# quoted, it would be a string and Alertmanager rejects the config.
# `bot_token` is quoted on purpose, so the token is always a string.
#
# Routes are edited here, not in the chart values.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    route:
      receiver: telegram
      group_by: [namespace, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Watchdog fires all the time by design: it proves the alerting
        # pipeline is alive. InfoInhibitor exists only to inhibit `info`
        # alerts. Neither is news.
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"

    # The chart's default inhibitions, kept because this config replaces
    # the chart's: a critical alert silences its own warning, and
    # InfoInhibitor silences info alerts in the same namespace.
    inhibit_rules:
      - source_matchers: [severity = "critical"]
        target_matchers: [severity =~ "warning|info"]
        equal: [namespace, alertname]
      - source_matchers: [severity = "warning"]
        target_matchers: [severity = "info"]
        equal: [namespace, alertname]
      - source_matchers: [alertname = "InfoInhibitor"]
        target_matchers: [severity = "info"]
        equal: [namespace]

    receivers:
      - name: "null"
      - name: telegram
        telegram_configs:
          - bot_token: "<path:kv-prod/data/monitoring/alertmanager#TELEGRAM_BOT_TOKEN>"
            chat_id: <path:kv-prod/data/monitoring/alertmanager#TELEGRAM_CHAT_ID>
