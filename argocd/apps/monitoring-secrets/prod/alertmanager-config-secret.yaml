# The whole Alertmanager configuration, mounted through the chart's
# alertmanager.alertmanagerSpec.configSecret. It lives here rather than
# in the chart values because it carries two credentials, and no
# <path:...> placeholder may sit in a Helm values file.
#
# Why the whole config and not just a token file: Telegram's `chat_id`
# is an integer in Alertmanager's config and has no `_file` variant.
# AVP replaces the placeholder text inside the string below *before*
# Alertmanager parses that string as YAML, so `chat_id: <path:...>`
# becomes `chat_id: -100123...`, a bare integer. Leave it unquoted:
# quoted, it would be a string and Alertmanager rejects the config.
# `bot_token` is quoted on purpose, so the token is always a string.
#
# Routes are edited here, not in the chart values.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    # One Telegram message per alert name and namespace, not per job: a
    # scrape job is an implementation detail, the namespace is what owns
    # the broken thing. 30s lets related alerts land in one message; a
    # group already sent is updated at most every 5m and repeated every
    # 12h while it fires.
    route:
      receiver: telegram
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Watchdog fires all the time by design: it proves the alerting
        # pipeline is alive. InfoInhibitor exists only to inhibit `info`
        # alerts. Neither is news.
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
        # Pages (the chart's `critical`, and the fast SLO burn) repeat
        # sooner than tickets: two days of error budget is gone in 4h.
        - receiver: telegram
          matchers:
            - severity = "critical"
          repeat_interval: 4h

    # The chart's default inhibitions, kept because this config replaces
    # the chart's: a critical alert silences its own warning, and
    # InfoInhibitor silences info alerts in the same namespace.
    inhibit_rules:
      - source_matchers: [severity = "critical"]
        target_matchers: [severity =~ "warning|info"]
        equal: [namespace, alertname]
      - source_matchers: [severity = "warning"]
        target_matchers: [severity = "info"]
        equal: [namespace, alertname]
      - source_matchers: [alertname = "InfoInhibitor"]
        target_matchers: [severity = "info"]
        equal: [namespace]

    receivers:
      - name: "null"
      - name: telegram
        telegram_configs:
          - bot_token: "<path:kv-prod/data/monitoring/alertmanager#TELEGRAM_BOT_TOKEN>"
            chat_id: <path:kv-prod/data/monitoring/alertmanager#TELEGRAM_CHAT_ID>
            # Header by severity, so a page and a ticket read differently
            # at a glance: critical is PAGE, warning is TICKET (the
            # chart's convention, and the SLO rules' fast and slow burn).
            # Telegram parses HTML here, so every annotation is escaped
            # with `html`: a stray `<` would make it reject the message.
            # The chart's own alerts carry `runbook_url` instead of our
            # `runbook` hint; either is shown.
            parse_mode: HTML
            message: |-
              {{ if eq .Status "resolved" }}<b>RESOLVED</b>{{ else if eq .CommonLabels.severity "critical" }}<b>PAGE</b>{{ else if eq .CommonLabels.severity "warning" }}<b>TICKET</b>{{ else }}<b>INFO</b>{{ end }} {{ .CommonLabels.alertname | html }}{{ with .CommonLabels.namespace }} in {{ . | html }}{{ end }}
              {{ range .Alerts }}
              {{ if eq .Status "resolved" }}<i>resolved:</i> {{ end }}{{ if .Annotations.summary }}{{ .Annotations.summary | html }}{{ else }}{{ .Annotations.message | html }}{{ end }}
              {{ with .Annotations.description }}{{ . | html }}{{ end }}
              {{ with .Annotations.runbook }}<i>Next:</i> {{ . | html }}{{ else }}{{ with .Annotations.runbook_url }}<i>Runbook:</i> {{ . | html }}{{ end }}{{ end }}
              {{ end }}
