# Grafana's admin login, read through the chart's
# grafana.admin.existingSecret. Rendered by argocd-vault-plugin at sync
# time; the values live only in Vault's KV on vault-02.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
stringData:
  admin-user: <path:kv-prod/data/monitoring/grafana#admin-user>
  admin-password: <path:kv-prod/data/monitoring/grafana#admin-password>
