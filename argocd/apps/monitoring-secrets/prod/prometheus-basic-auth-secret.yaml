# Basic-auth htpasswd line for the prod Prometheus remote-write Ingress;
# ingress-nginx reads the `auth` key. Rendered by argocd-vault-plugin at
# sync time; the placeholder is not a secret.
#
# Operator seeds, once: kv-prod/monitoring/remote-write field `htpasswd`
# (bcrypt line, generated on the Mac: printf '%s:%s' <user>
# "$(argocd account bcrypt --password '<password>')"), and kv-dev/monitoring/remote-write fields `username` and
# `password` for the dev sender (sub-project 4).
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-basic-auth
  namespace: monitoring
  annotations:
    # Server-side apply, as dev's copy: client-side apply would write the
    # hash into a last-applied annotation readable with `get secret`.
    argocd.argoproj.io/sync-options: ServerSideApply=true
type: Opaque
stringData:
  auth: <path:kv-prod/data/monitoring/remote-write#htpasswd>
