# ingress-nginx for the prod cluster, same shape as dev (ADR 0002).
#
# The Application labels this namespace Pod Security `privileged`: Talos
# enforces `baseline`, which rejects the hostPort below.
controller:
  # DaemonSet + hostPort rather than a Service. This cluster is bare metal
  # with no LoadBalancer and no MetalLB, so the only other option is a
  # NodePort in the 30000-32767 range -- which puts a port in every URL and
  # is what harbor's "externalURL: http://harbor.mgryn.cc:31529" was
  # already working around. Binding 80/443 on each node keeps hostnames
  # clean and needs nothing but a DNS A record.
  kind: DaemonSet
  hostPort:
    enabled: true
    ports:
      http: 80
      https: 443

  # No Service: with hostPort the node IP is the entry point, and a
  # ClusterIP Service in front of it would only add a hop.
  service:
    enabled: false

  # publishService needs a Service to read an external IP from; without one
  # it cannot resolve an address and every Ingress keeps the empty ADDRESS
  # this app exists to fix. The node IPs are reported instead.
  publishService:
    enabled: false
  reportNodeInternalIp: true

  ingressClassResource:
    name: nginx
    enabled: true
    # default: true so future apps can omit className entirely. harbor's
    # values already set className: nginx explicitly, which keeps working.
    default: true

  # No control-plane toleration, unlike dev: prod's DNS points at the two
  # workers only, so the DaemonSet runs on exactly those.

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  # metrics.service is independent of the main `service` above (which is
  # disabled -- hostPort is the entry point for traffic). It defaults to
  # enabled: true on its own. The prometheus.io/* annotations below are
  # harmless but unused on prod: kube-prometheus-stack has no
  # annotation-based scrape jobs, so nothing scrapes this Service yet. A
  # ServiceMonitor will, added by the alerting PR in an Application that
  # syncs after the monitoring chart, so its CRD exists. Do not set
  # `serviceMonitor.enabled` here: this Application syncs before the CRD
  # exists and the sync would fail permanently.
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "10254"
