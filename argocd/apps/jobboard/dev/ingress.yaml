apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobboard
  annotations:
    # Names a ClusterIssuer, not an Issuer -- cert-manager-issuers owns
    # both, cluster scoped.
    #
    # letsencrypt-staging issued here first and reached Ready on
    # 2026-09-17, which is what proved the DNS-01 path: the Cloudflare
    # token's two permissions, the zone selector, and cert-manager
    # resolving the challenge TXT through Cloudflare's resolvers rather
    # than following this homelab's split-horizon A record. Staging
    # chains to an untrusted root, so that certificate proved the
    # plumbing without spending production rate limits (5 failed
    # validations per hostname per hour, 50 certificates per domain per
    # week) on a misconfiguration.
    #
    # Switching back to staging is the diagnostic if issuance ever breaks
    # again -- letsencrypt-staging stays defined for exactly that.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  # ingress-nginx runs as a DaemonSet on host ports 80/443 (bare metal, no
  # LoadBalancer). dev-jobs.mgryn.cc is a DNS-only (grey cloud) Cloudflare
  # A record for 10.0.0.101; jobs.mgryn.cc is prod's (ADR 0028).
  ingressClassName: nginx
  # cert-manager watches this block: it creates a Certificate named after
  # secretName, solves the challenge, and writes the result there.
  # Nothing pre-creates jobboard-tls -- an empty Secret of that name
  # would be adopted and left empty.
  #
  # ingress-nginx redirects HTTP to HTTPS by default once a host has TLS
  # configured, so http://dev-jobs.mgryn.cc starts 308-ing to https once this
  # lands. That is also what makes the app's secure-cookie default
  # workable: the cookie will not travel over plain HTTP at all.
  tls:
    - hosts:
        - dev-jobs.mgryn.cc
      secretName: jobboard-tls
  rules:
    - host: dev-jobs.mgryn.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jobboard
                port:
                  number: 80
