apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jobboard

resources:
  - ../base
  # The placeholders here name kv-dev; a base a prod overlay also
  # consumes must not carry an environment's mount.
  - secret.yaml
  - ghcr-secret.yaml
  - ingress.yaml

# The deploy history for dev: one line per release, bumped by hand after the
# app repo cuts a `v<version>` tag. Quoted deliberately -- `newTag: 1.0`
# parses as a float and renders as `jobboard:1`.
images:
  - name: ghcr.io/maxim-grin/jobboard
    newTag: "0.3.2"

# The base names no environment's storage; dev's claim template gets
# nfs-dev here. A JSON6902 add keeps the rest of the list intact.
patches:
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: nfs-dev
