# Values come from Vault at sync time via argocd-vault-plugin. The
# placeholders below are not secrets; the paths they name are read by the
# avp sidecar in argocd-repo-server. This file is committed to a public
# repository on purpose -- nothing here is sensitive.
apiVersion: v1
kind: Secret
metadata:
  name: jobboard-secrets
  namespace: jobboard
type: Opaque
stringData:
  POSTGRES_PASSWORD: <path:kv-dev/data/jobboard/db#POSTGRES_PASSWORD>
  DATABASE_URL: <path:kv-dev/data/jobboard/db#DATABASE_URL>
  JOBBOARD_SECRET: <path:kv-dev/data/jobboard/db#JOBBOARD_SECRET>
