# The dockerconfigjson value is assembled in Vault, not here: AVP substitutes
# the decoded JSON document, and stringData means Kubernetes does the
# base64 encoding. Vault must hold the DECODED JSON, not the base64 blob,
# or the pull secret double-encodes and fails at image-pull time. Seed it
# with
#   kubectl create secret docker-registry ghcr --dry-run=client -o json ...
# and store the resulting .dockerconfigjson, base64-decoded, at
# kv-dev/jobboard/ghcr -- seeded from the vault_kv -> kv-dev: block in
# ansible/secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr
  namespace: jobboard
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: <path:kv-dev/data/jobboard/ghcr#dockerconfigjson>
