# The dockerconfigjson value is assembled in Vault, not here: AVP substitutes
# the whole base64 blob. Seed it with
#   kubectl create secret docker-registry ghcr --dry-run=client -o json ...
# and store the resulting .dockerconfigjson at secret/jobboard/ghcr.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr
  namespace: jobboard
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: <path:secret/data/jobboard/ghcr#dockerconfigjson>
