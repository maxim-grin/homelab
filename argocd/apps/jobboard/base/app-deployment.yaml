apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobboard
spec:
  # One replica, deliberately. The crawler is not designed for concurrent
  # runs and nothing here makes it so; a second replica could crawl the same
  # board twice.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jobboard
  template:
    metadata:
      labels:
        app: jobboard
    spec:
      # The GHCR package is private, so the kubelet needs credentials before
      # it can pull. Created out of band with `kubectl create secret
      # docker-registry ghcr` -- see docs/rebuild.md's rebuild-order step
      # for the jobboard Secrets. Without it the pod sits in
      # ImagePullBackOff with "denied", which reads like a missing tag.
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: jobboard
          # No tag here on purpose. The base says WHICH image; the overlay's
          # `images:` transformer says WHICH VERSION. Naming :latest here
          # would point at a tag the app repo no longer publishes, and naming
          # a real version would be a second copy that drifts from the
          # overlay's. This way the repository holds exactly one version
          # string.
          image: ghcr.io/maxim-grin/jobboard
          # Explicit, not relied-on-default: the default tracks the tag
          # (Always for `:latest`, IfNotPresent otherwise). The old comment
          # here warned that pinning would flip this to IfNotPresent and
          # reintroduce stale-image confusion. That reasoning inverts once
          # the tag is immutable: staleness comes FROM a mutable tag, and a
          # published version tag is never re-pointed, so IfNotPresent can
          # only ever resolve to the same image. It also stops the kubelet
          # re-pulling on every pod start.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jobboard-secrets
                  key: DATABASE_URL
            - name: JOBBOARD_SECRET
              valueFrom:
                secretKeyRef:
                  name: jobboard-secrets
                  key: JOBBOARD_SECRET
          # Liveness does not touch the database: restarting cannot fix
          # Postgres, and a crash loop would hide the real fault.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          # Readiness does, so a pod that cannot reach the database leaves
          # the Service's endpoints instead of serving errors.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
