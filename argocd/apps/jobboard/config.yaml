# Where the set `apps` (argocd/environments/prod/applications/appset.yaml)
# deploys this app: one list entry per env, each generating
# `<cluster>-<dir>` from argocd/apps/<dir>/<env>. Rolled in on 2026-10-11
# (jobboard-prod).
#
- env: prod
  namespace: jobboard
  createNamespace: true
  # Keeps the rendered Secrets out of the last-applied-configuration
  # annotation, which would hold their values in clear text.
  serverSideApply: true
  # Compare the way it syncs. With the default diff the postgres
  # StatefulSet read OutOfSync forever on a claim template field the API
  # server fills in, though a server-side dry run changed nothing
  # (ADR 0030).
  serverSideDiff: true
