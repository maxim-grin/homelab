# Vault must hold the DECODED JSON at kv-prod/jobboard/ghcr, not the base64
# blob, or the pull secret double-encodes. It is seeded from the vault_kv
# kv-prod block in ansible/secret.yaml (see secret.yaml.example).
apiVersion: v1
kind: Secret
metadata:
  name: ghcr
  namespace: jobboard
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: <path:kv-prod/data/jobboard/ghcr#dockerconfigjson>
