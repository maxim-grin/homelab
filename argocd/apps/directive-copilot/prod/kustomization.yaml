apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: directive-copilot

resources:
  - ../base
  - secret.yaml

# The digest goes inside newTag: Renovate skips an entry that sets both
# `newTag` and `digest`.
images:
  - name: pgvector/pgvector
    newTag: "0.8.7-pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f"

patches:
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: nfs-prod
  - target:
      kind: PersistentVolumeClaim
      name: postgres-backup
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: nfs-prod
