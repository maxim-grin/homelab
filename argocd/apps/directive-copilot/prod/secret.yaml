# argocd-vault-plugin fills the placeholders from Vault at sync time; this file
# is committed to a public repository and holds nothing secret.
apiVersion: v1
kind: Secret
metadata:
  name: directive-copilot-db
  namespace: directive-copilot
type: Opaque
stringData:
  POSTGRES_PASSWORD: <path:kv-prod/data/directive-copilot/db#POSTGRES_PASSWORD>
