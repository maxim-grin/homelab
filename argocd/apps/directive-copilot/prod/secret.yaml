# argocd-vault-plugin fills the placeholders from Vault at sync time; this file
# is committed to a public repository and holds nothing secret.
apiVersion: v1
kind: Secret
metadata:
  name: directive-copilot-db
  namespace: directive-copilot
type: Opaque
stringData:
  POSTGRES_PASSWORD: <path:kv-prod/data/directive-copilot/db#POSTGRES_PASSWORD>
---
apiVersion: v1
kind: Secret
metadata:
  name: directive-copilot-llm
  namespace: directive-copilot
type: Opaque
stringData:
  LITELLM_MASTER_KEY: <path:kv-prod/data/directive-copilot/llm#LITELLM_MASTER_KEY>
  OPENROUTER_API_KEY: <path:kv-prod/data/directive-copilot/llm#OPENROUTER_API_KEY>
