# A volume of its own, so losing the database's volume leaves the dumps. Both
# sit on the same disk on nfs-01: this is not protection against disk loss.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup
spec:
  accessModes: [ReadWriteOnce]
  # storageClassName comes from the overlay.
  resources:
    requests:
      storage: 5Gi
