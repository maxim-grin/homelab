apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      # 65532 is the image's nonroot user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litellm
          # The overlay's `images:` sets the version; the repo holds one version string.
          image: ghcr.io/berriai/litellm
          imagePullPolicy: IfNotPresent
          args: ["--config", "/app/config/config.yaml", "--port", "4000"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: directive-copilot-llm
                  key: LITELLM_MASTER_KEY
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: directive-copilot-llm
                  key: OPENROUTER_API_KEY
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          # Start-up imports a large Python tree and retries a price-list
          # download; the startup probe keeps liveness from killing it.
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: config
          configMap:
            name: litellm-config
