apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: directive-copilot

resources:
  - namespace.yaml
  - postgres-statefulset.yaml
  - postgres-service.yaml
  - backup-pvc.yaml
  - backup-cronjob.yaml
  - ollama-deployment.yaml
  - ollama-service.yaml
  - ollama-pvc.yaml

# The names carry a content hash, so a changed script reaches the next run.
configMapGenerator:
  - name: postgres-backup-script
    files:
      - backup.sh
  - name: ollama-pull-script
    files:
      - pull-model.sh
