apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deliberately no `namespace:` transformer. kustomize has no schema for
# cert-manager's CRDs, so it cannot tell a ClusterIssuer is cluster
# scoped and stamps the namespace onto it too -- which is meaningless at
# best and an "is cluster-scoped but has a namespace" complaint from
# ArgoCD at worst. The one namespaced resource here carries its own
# `namespace: cert-manager` instead.
#
# That namespace is also why these live in their own Application rather
# than in jobboard's: jobboard's kustomization sets `namespace: jobboard`,
# which would rewrite the Secret into a namespace cert-manager never
# looks in, and the issuer would fail with what reads like a Cloudflare
# error.
resources:
  - cloudflare-secret.yaml
  - clusterissuers.yaml
