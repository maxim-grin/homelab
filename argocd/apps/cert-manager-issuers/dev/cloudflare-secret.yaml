# Rendered by argocd-vault-plugin at sync time. The placeholder is what is
# committed; the token behind it lives only in Vault's KV on vault-01 and
# is never in this repository under any name.
#
# The token needs TWO Cloudflare permissions on the mgryn.cc zone, not one:
#   Zone -> DNS   -> Edit   (write the _acme-challenge TXT record)
#   Zone -> Zone  -> Read   (look the zone up by name first)
# With DNS:Edit alone, cert-manager fails the zone lookup and reports
# something that reads like a DNS problem rather than a permissions one.
#
# This is a different credential from anything Cloudflare Universal SSL
# uses. It only writes an ACME challenge record; it is not involved in
# serving mgryn.cc.
#
# Namespace is cert-manager, not jobboard: a ClusterIssuer is cluster
# scoped, so cert-manager resolves its secret references against
# --cluster-resource-namespace, which defaults to its own namespace. A
# copy of this in jobboard's namespace would simply never be read.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
type: Opaque
stringData:
  API_TOKEN: <path:secret/data/cert-manager/cloudflare#API_TOKEN>
