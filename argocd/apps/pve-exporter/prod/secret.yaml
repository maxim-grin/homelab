# Credentials for the exporter's read-only Proxmox API token
# (pve-exporter@pve!pve-exporter, role PVEAuditor, created by
# scripts/pve-bootstrap.sh). Rendered by argocd-vault-plugin at sync time;
# the values live only in Vault's KV on vault-02. The ServerSideApply sync
# option on the Application keeps the rendered values out of a
# last-applied-configuration annotation.
apiVersion: v1
kind: Secret
metadata:
  name: pve-exporter
  namespace: monitoring
type: Opaque
stringData:
  PVE_USER: <path:kv-prod/data/monitoring/pve-exporter#PVE_USER>
  PVE_TOKEN_NAME: <path:kv-prod/data/monitoring/pve-exporter#PVE_TOKEN_NAME>
  PVE_TOKEN_VALUE: <path:kv-prod/data/monitoring/pve-exporter#PVE_TOKEN_VALUE>
