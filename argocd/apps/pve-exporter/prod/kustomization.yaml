apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything prod's Prometheus needs to scrape Proxmox. The Secret and the
# ServiceMonitor carry <path:...> placeholders that AVP resolves at sync
# time. No `namespace:` transformer: each resource names its own, and
# the Namespace belongs to monitoring-secrets.
resources:
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
