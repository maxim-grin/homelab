apiVersion: apps/v1
kind: Deployment
metadata:
  name: pve-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pve-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pve-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pve-exporter
    spec:
      securityContext:
        # The image's own user, prometheus (uid 101).
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pve-exporter
          image: prompve/prometheus-pve-exporter:3.10.0
          ports:
            - name: http
              containerPort: 9221
          # With PVE_USER set the exporter builds its single `default`
          # module from these variables and ignores /etc/prometheus/pve.yml,
          # so no config file is mounted.
          envFrom:
            - secretRef:
                name: pve-exporter
          env:
            # Proxmox serves a self-signed certificate (the host has no
            # ACME), so verification would fail every scrape.
            - name: PVE_VERIFY_SSL
              value: "false"
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # gunicorn keeps its worker heartbeat files in the temp
            # directory, which a read-only root filesystem would deny.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
