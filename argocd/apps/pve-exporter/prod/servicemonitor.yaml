# Open selectors on the monitoring chart (see its values) pick this up
# without a release label.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pve-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pve-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pve-exporter
  endpoints:
    - port: http
      # /pve, not /metrics: /metrics is the exporter's own process
      # metrics, /pve queries Proxmox for `target`.
      path: /pve
      params:
        # The Proxmox host's address is recorded only in the encrypted
        # secret.yaml, so it comes from Vault rather than a committed IP.
        target:
          - <path:kv-prod/data/monitoring/pve-exporter#PVE_TARGET>
      # Each scrape is a round of Proxmox API calls; give it room.
      interval: 60s
      scrapeTimeout: 30s
