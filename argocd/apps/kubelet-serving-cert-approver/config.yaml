# Where the set `apps` (argocd/environments/prod/applications/appset.yaml)
# deploys this app: one list entry per env. The manifest brings its own
# Namespace. It approves kubelet serving certificate requests, which
# kube-controller-manager signs. It must be healthy before a kubelet
# requests one: until approval, logs, exec, port-forward and kubelet
# scrapes for that node fail.
- env: prod
  namespace: kubelet-serving-cert-approver
  createNamespace: false
  serverSideApply: true
  serverSideDiff: true
