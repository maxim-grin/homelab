name: ci

# No `paths:` filter on the workflow: with required checks, a workflow skipped
# by one leaves its checks pending forever and blocks merge. Jobs gate
# themselves on the `changes` job instead (ADR 0031).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=pypi depName=pre-commit
  PRE_COMMIT_VERSION: "4.6.2"
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: "0.13.0"
  # renovate: datasource=pypi depName=ansible-lint
  ANSIBLE_LINT_VERSION: "26.9.0"
  # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.+)$
  TERRAFORM_VERSION: "1.16.5"
  # renovate: datasource=github-releases depName=terraform-linters/tflint
  TFLINT_VERSION: "v0.64.0"
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: "v4.3.0"
  # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize extractVersion=^kustomize/v(?<version>.+)$
  KUSTOMIZE_VERSION: "5.8.1"
  # renovate: datasource=github-releases depName=yannh/kubeconform extractVersion=^v(?<version>.+)$
  KUBECONFORM_VERSION: "0.8.0"
  # renovate: datasource=github-releases depName=mikefarah/yq extractVersion=^v(?<version>.+)$
  YQ_VERSION: "4.53.6"
  # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.+)$
  GITLEAKS_VERSION: "8.30.0"
  # renovate: datasource=github-releases depName=google/go-jsonnet extractVersion=^v(?<version>.+)$
  JSONNET_VERSION: "0.22.0"
  # renovate: datasource=github-releases depName=jsonnet-bundler/jsonnet-bundler extractVersion=^v(?<version>.+)$
  JB_VERSION: "0.6.0"
  # SHA-256 of each release asset downloaded below, from GitHub's per-asset
  # digest (ADR 0017). For a new version:
  #   gh api repos/<owner>/<repo>/releases/tags/<tag> \
  #     --jq '.assets[] | select(.name=="<asset>") | .digest'
  GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
  KUSTOMIZE_SHA256: "029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d"
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
  YQ_SHA256: "c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385"
  JSONNET_SHA256: "e87a93ea44e34da92c15636205c7f2240bf3ac92d00ccb855dbb4e7e03ea6941"
  # jsonnet-bundler publishes no digest: computed from the downloaded asset.
  JB_SHA256: "78e54afbbc3ff3e0942b1576b4992277df4f6beb64cddd58528a76f0cd70db54"

jobs:
  # Which areas a pull request touches. The jobs below skip themselves when
  # their area is untouched; a skipped job counts as passing for the
  # required checks, which is why the gating is here and not in `on:` paths
  # (a skipped workflow leaves its checks pending and blocks the merge).
  # A push to main skips this step and every gated job runs (ADR 0031).
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ansible: ${{ steps.filter.outputs.ansible }}
      terraform: ${{ steps.filter.outputs.terraform }}
      manifests: ${{ steps.filter.outputs.manifests }}
      dashboards: ${{ steps.filter.outputs.dashboards }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yaml
              - .pre-commit-config.yaml
              - ansible/requirements.yml
              - .tflint.hcl
            ansible:
              - *ci
              - ansible/**
            terraform:
              - *ci
              - terraform/**
            manifests:
              - *ci
              - argocd/**
              - scripts/check-manifests.sh
            dashboards:
              - *ci
              - dashboards/**
              - argocd/apps/grafana-dashboards/**
              - scripts/check-dashboards.sh
              - scripts/tests/check-dashboards.test.sh
              - scripts/tests/fixtures/dashboards/**
            scripts:
              - *ci
              - scripts/**
              - docs/runbooks/**
              - ansible/playbooks/**
              - ansible/inventories/**
              - terraform/environments/prod/variables.tf

  # The repo's own hooks: file hygiene, check-yaml, private-key and gitleaks
  # scans. ansible-lint, terraform-fmt and jsonnetfmt are `language: system`
  # hooks that need the Ansible toolchain, the terraform binary and
  # jsonnet, so CI skips them here and runs them in the `ansible-lint`,
  # `terraform` and `dashboards` jobs instead.
  pre-commit:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install pre-commit
        run: uv tool install "pre-commit==${PRE_COMMIT_VERSION}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run hooks
        env:
          SKIP: ansible-lint,terraform-fmt,jsonnetfmt
        run: pre-commit run --all-files --show-diff-on-failure
      # The gitleaks hook above scans only staged changes, and nothing is
      # staged in CI, so it passes having scanned nothing. This is the real
      # scan: the full checked-out history, same gitleaks version as the hook.
      - name: Install gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tmp/gitleaks.tgz" | sha256sum --strict -c -
          tar -xz -f "$tmp/gitleaks.tgz" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan history for secrets
        run: gitleaks git --redact --no-banner --verbose

  # Same commit-msg hook as locally, run over every non-merge commit in the
  # PR. Not on push to main: GitHub's "Merge pull request #N" commits would
  # fail the convention.
  commits:
    # Renovate's titles ("chore(deps): update … to …") run past the
    # 50-character subject limit, and this job checks the commits on the
    # branch, not the message the owner types when squash-merging. The
    # human rules still apply to every other pull request.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install pre-commit
        run: uv tool install "pre-commit==${PRE_COMMIT_VERSION}"
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          msg=$(mktemp)
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            git log -1 --format=%B "$sha" > "$msg"
            echo "-- $(git log -1 --format='%h %s' "$sha")"
            # Both commit-msg hooks, by id: without one, pre-commit also runs
            # every hook that declares no stages, once per commit.
            for hook in conventional-pre-commit commit-msg-format; do
              pre-commit run "$hook" \
                --hook-stage commit-msg --commit-msg-filename "$msg" || status=1
            done
          done
          exit "$status"

  # The whole ansible/ project, as the local hook lints it: handed a single
  # playbook ansible-lint cannot resolve its roles. No --syntax-check with
  # secret.yaml: it needs the vault password, which CI does not have.
  ansible-lint:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.ansible == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      # ansible-core's executables (ansible-galaxy, ansible-playbook) are not
      # on PATH from a bare tool install; the collections step and ansible-lint
      # itself need them.
      - name: Install ansible-lint
        run: uv tool install "ansible-lint==${ANSIBLE_LINT_VERSION}" --with-executables-from ansible-core
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ runner.os }}-${{ hashFiles('ansible/requirements.yml') }}
      - name: Install collections
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: ansible-lint
        run: cd ansible && ansible-lint .

  terraform:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      # Skipped in the pre-commit job, which has no terraform binary.
      - name: terraform fmt
        run: terraform fmt -recursive -check -diff terraform
      # backend.tf is gitignored, so -backend=false is the only init that
      # can work here; validate needs no variables and no credentials.
      - name: terraform init and validate
        run: |
          for env in dev shared prod; do
            terraform -chdir=terraform/environments/$env init -backend=false -input=false
            terraform -chdir=terraform/environments/$env validate
          done
      # Mock-provider tests: nothing reaches Proxmox or a Talos node.
      - name: terraform test
        run: |
          for env in dev prod; do
            terraform -chdir=terraform/environments/$env test
          done
      - name: tflint
        run: |
          for env in dev shared prod; do
            tflint --chdir=terraform/environments/$env --config="${GITHUB_WORKSPACE}/.tflint.hcl"
          done

  manifests:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.manifests == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kustomize, kubeconform and yq
        run: |
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          gh="https://github.com"
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/kustomize.tgz" "${gh}/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tmp/kubeconform.tgz" "${gh}/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          curl -fsSL -o "$tmp/yq" "${gh}/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          {
            echo "${KUSTOMIZE_SHA256}  $tmp/kustomize.tgz"
            echo "${KUBECONFORM_SHA256}  $tmp/kubeconform.tgz"
            echo "${YQ_SHA256}  $tmp/yq"
          } | sha256sum --strict -c -
          tar -xz -f "$tmp/kustomize.tgz" -C "$bin" kustomize
          tar -xz -f "$tmp/kubeconform.tgz" -C "$bin" kubeconform
          install -m 0755 "$tmp/yq" "$bin/yq"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Render and schema-check manifests
        run: scripts/check-manifests.sh

  # Grafana dashboards are jsonnet; the committed JSON must be exactly what
  # the source renders (scripts/check-dashboards.sh).
  dashboards:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.dashboards == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install jsonnet, jb, kustomize and yq
        run: |
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          gh="https://github.com"
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/jsonnet.tgz" "${gh}/google/go-jsonnet/releases/download/v${JSONNET_VERSION}/go-jsonnet_${JSONNET_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tmp/jb" "${gh}/jsonnet-bundler/jsonnet-bundler/releases/download/v${JB_VERSION}/jb-linux-amd64"
          curl -fsSL -o "$tmp/kustomize.tgz" "${gh}/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tmp/yq" "${gh}/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          {
            echo "${JSONNET_SHA256}  $tmp/jsonnet.tgz"
            echo "${JB_SHA256}  $tmp/jb"
            echo "${KUSTOMIZE_SHA256}  $tmp/kustomize.tgz"
            echo "${YQ_SHA256}  $tmp/yq"
          } | sha256sum --strict -c -
          tar -xz -f "$tmp/jsonnet.tgz" -C "$bin" jsonnet jsonnetfmt
          tar -xz -f "$tmp/kustomize.tgz" -C "$bin" kustomize
          install -m 0755 "$tmp/jb" "$bin/jb"
          install -m 0755 "$tmp/yq" "$bin/yq"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Dashboards match their sources
        run: scripts/check-dashboards.sh
      - name: Dashboard check tests
        run: scripts/tests/check-dashboards.test.sh

  # The Proxmox bootstrap script: lint it, check its Talos pins against the
  # prod root, run its stub-based tests. The runbook guard and the
  # ApplicationSet check's fixture tests run here too. shellcheck is
  # preinstalled on the runner image.
  scripts:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck scripts/pve-bootstrap.sh scripts/check-talos-pins.sh scripts/check-runbooks.sh scripts/tests/pve-bootstrap.test.sh scripts/tests/check-runbooks.test.sh scripts/check-appsets.sh scripts/tests/check-appsets.test.sh scripts/verify-dev.sh scripts/tests/verify-dev.test.sh scripts/check-dashboards.sh scripts/tests/check-dashboards.test.sh
      - name: Talos pins match the prod root
        run: scripts/check-talos-pins.sh
      - name: Runbooks match the playbooks
        run: scripts/check-runbooks.sh
      - name: Runbook guard tests
        run: scripts/tests/check-runbooks.test.sh
      - name: Bootstrap script tests
        run: scripts/tests/pve-bootstrap.test.sh
      - name: Dev verification script tests
        run: scripts/tests/verify-dev.test.sh
      - name: Install yq
        run: |
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          curl -fsSL -o "$bin/yq" "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  $bin/yq" | sha256sum --strict -c -
          chmod 0755 "$bin/yq"
          echo "$bin" >> "$GITHUB_PATH"
      - name: ApplicationSet check tests
        run: scripts/tests/check-appsets.test.sh
