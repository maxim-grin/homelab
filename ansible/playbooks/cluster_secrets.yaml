---
- name: Apply out-of-band cluster Secrets
  hosts: k8s_control_plane
  gather_facts: false

  # The role's kubernetes.core tasks need this library on the target. The
  # other playbooks that install it (argocd-dev, coredns_hosts) may not have
  # run yet on a freshly built control plane.
  pre_tasks:
    - name: Install the Python Kubernetes library
      ansible.builtin.apt:
        name: python3-kubernetes
        state: present

  roles:
    - role: cluster_secrets
