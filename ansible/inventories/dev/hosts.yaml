all:
  vars:
    ansible_user: "{{ user_name }}"
    ansible_private_key_file: "{{ ssh_private_key }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  children:
    k8s_cluster:
      children:
        k8s_control_plane:
          hosts:
            master-01:
              ansible_host: "{{ host_ips['master-01'] }}"
              proxmox_vm_id: "{{ proxmox_vm_ids['master-01'] }}"
        k8s_workers:
          hosts:
            worker-01:
              ansible_host: "{{ host_ips['worker-01'] }}"
              proxmox_vm_id: "{{ proxmox_vm_ids['worker-01'] }}"
            worker-02:
              ansible_host: "{{ host_ips['worker-02'] }}"
              proxmox_vm_id: "{{ proxmox_vm_ids['worker-02'] }}"
    claude_code:
      hosts:
        claude-code-01:
          ansible_host: "{{ host_ips['claude-code-01'] }}"
          proxmox_vm_id: "{{ proxmox_vm_ids['claude-code-01'] }}"
    nfs:
      hosts:
        nfs-01:
          ansible_host: "{{ host_ips['nfs-01'] }}"
          proxmox_vm_id: "{{ proxmox_vm_ids['nfs-01'] }}"
    vault:
      # ansible_user: root, overriding the all-level "{{ user_name }}".
      # Every other host is a cloud-init VM with an `ubuntu` account; this is a
      # Debian LXC template, which has only root, and proxmox_lxc injects
      # ssh_public_keys for root. Without this override the play fails at the
      # connection, before any task runs. inventories/prod/hosts.yaml sets the
      # same override on its vault-lxc host, which is a working reference.
      vars:
        ansible_user: root
      hosts:
        vault-01:
          ansible_host: "{{ host_ips['vault-01'] }}"
          proxmox_vm_id: "{{ proxmox_vm_ids['vault-01'] }}"
