# Machines no single environment owns. nfs-01 serves both nfs-dev and
# nfs-prod, so it is here rather than in inventories/dev or
# inventories/prod. Run its playbook with -i inventories/shared; ansible.cfg
# defaults to inventories/dev, where nfs-01 no longer is.
all:
  vars:
    ansible_user: "{{ user_name }}"
    ansible_private_key_file: "{{ ssh_private_key }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  children:
    nfs:
      hosts:
        nfs-01:
          ansible_host: "{{ host_ips['nfs-01'] }}"
          proxmox_vm_id: "{{ proxmox_vm_ids['nfs-01'] }}"
    # The Vault VM that replaces the vault-01 LXC. It is a cloud-init Ubuntu
    # VM, so it uses the all-level ansible_user -- unlike the LXC, whose
    # Debian template has only root. Both exist until the cutover; this group
    # is named vault_vm so the old vault group keeps working meanwhile.
    vault_vm:
      hosts:
        vault-02:
          ansible_host: "{{ host_ips['vault-02'] }}"
          proxmox_vm_id: "{{ proxmox_vm_ids['vault-02'] }}"
