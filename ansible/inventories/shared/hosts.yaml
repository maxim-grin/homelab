# Machines no single environment owns. nfs-01 serves both nfs-dev and
# nfs-prod, so it is here rather than in inventories/dev or
# inventories/prod. Run its playbook with -i inventories/shared; ansible.cfg
# defaults to inventories/dev, where nfs-01 no longer is.
all:
  vars:
    ansible_user: "{{ user_name }}"
    ansible_private_key_file: "{{ ssh_private_key }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  children:
    nfs:
      hosts:
        nfs-01:
          ansible_host: "{{ host_ips['nfs-01'] }}"
          proxmox_vm_id: "{{ proxmox_vm_ids['nfs-01'] }}"
    # The Vault VM both clusters use. The LXC it replaced is gone; this is a
    # cloud-init Ubuntu VM, so it uses the all-level ansible_user.
    vault:
      hosts:
        vault-02:
          ansible_host: "{{ host_ips['vault-02'] }}"
          proxmox_vm_id: "{{ proxmox_vm_ids['vault-02'] }}"
    # One unprivileged LXC per LAN service. Containers have no cloud-init
    # user: Terraform injects the key for root, there is no sudo in the
    # Debian template, and become would only fail looking for it.
    lan_services:
      vars:
        ansible_user: root
        ansible_become: false
      children:
        pihole:
          hosts:
            pihole:
              ansible_host: "{{ host_ips['pihole'] }}"
              proxmox_vm_id: "{{ proxmox_vm_ids['pihole'] }}"
        traefik:
          hosts:
            traefik:
              ansible_host: "{{ host_ips['traefik'] }}"
              proxmox_vm_id: "{{ proxmox_vm_ids['traefik'] }}"
        glance:
          hosts:
            glance:
              ansible_host: "{{ host_ips['glance'] }}"
              proxmox_vm_id: "{{ proxmox_vm_ids['glance'] }}"
        gatus:
          hosts:
            gatus:
              ansible_host: "{{ host_ips['gatus'] }}"
              proxmox_vm_id: "{{ proxmox_vm_ids['gatus'] }}"
        orangutan:
          hosts:
            orangutan:
              ansible_host: "{{ host_ips['orangutan'] }}"
              proxmox_vm_id: "{{ proxmox_vm_ids['orangutan'] }}"
