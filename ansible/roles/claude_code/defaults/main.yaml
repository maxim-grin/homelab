---
# Default values for the Claude Code workstation role
claude_code_user: "{{ user_name }}"
claude_code_home: "/home/{{ claude_code_user }}"

# Node is here for the projects you check out on this box, not for Claude
# Code itself -- the native installer ships its own runtime.
claude_code_nodejs_major: 22
claude_code_nodejs_repo_key_url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key

claude_code_installer_url: https://claude.ai/install.sh

claude_code_packages:
  - build-essential
  - ca-certificates
  - curl
  - fd-find
  - git
  - jq
  - ripgrep
  - unzip
