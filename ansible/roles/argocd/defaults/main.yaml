---
# Default values for ArgoCD installation
argocd_namespace: argocd
argocd_version: v8.6.3
argocd_install_method: helm
argocd_helm_repo: https://argoproj.github.io/argo-helm
argocd_helm_chart: argo-cd
# Kept alongside the ingress on purpose. The ingress runs through
# ingress-nginx; when that is broken the NodePort is the only remaining way
# into the UI to diagnose it. argocd-dev.yaml sets this true.
argocd_nodeport_enabled: false
argocd_nodeport_http_port: 32080
argocd_nodeport_https_port: 32443
argocd_context_kubeconfig: /etc/kubernetes/admin.conf

# No argocd_helm_values: the repo-server ran stock. An earlier version wired
# argocd-vault-plugin in here -- a download-tools initContainer, an avp
# cmp-server sidecar, a cmp-plugin ConfigMap volume and an
# argocd-vault-plugin-config Secret -- but nothing in this repo ever created
# those two objects. kubelet looped on
#   MountVolume.SetUp failed for volume "cmp-plugin": configmap not found
# so argocd-repo-server never left Init and every Application sat at sync
# status Unknown. No manifest here contains a single <path:...> placeholder,
# so AVP was substituting nothing; secrets are plain Secret manifests,
# gitignored and applied out of band.
argocd_helm_values:
  server:
    # nginx terminates the connection and speaks plain HTTP to argocd-server.
    # Without this, argocd-server serves HTTPS, nginx proxies HTTP to it, and
    # the UI answers with a redirect loop rather than an error.
    insecure: true
    ingress:
      enabled: true
      ingressClassName: nginx
      hostname: argocd.mgryn.cc
