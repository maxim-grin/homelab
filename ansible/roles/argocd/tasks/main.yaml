---
- name: Ensure ArgoCD namespace exists
  kubernetes.core.k8s:
    state: present
    kind: Namespace
    name: "{{ argocd_namespace }}"
    kubeconfig: "{{ argocd_context_kubeconfig }}"

- name: Add Argo Helm repository
  kubernetes.core.helm_repository:
    name: argo
    repo_url: "{{ argocd_helm_repo }}"

- name: Require the admin password hash
  # Before the Helm deploy, so a missing hash fails here with an actionable
  # message rather than producing a working ArgoCD whose password is a random
  # string in argocd-initial-admin-secret.
  when: argocd_install_method == 'helm'
  ansible.builtin.assert:
    that:
      - argocd_admin_password_hash is defined
      - argocd_admin_password_hash | length > 0
      - argocd_admin_password_hash.startswith('$2a$')
    fail_msg: >-
      argocd_admin_password_hash must be set in ansible/secret.yaml to a
      bcrypt hash starting with $2a$. Generate one with:
      htpasswd -nbBC 10 "" 'thepassword' | tr -d ':\n' | sed 's/$2y/$2a/'

- name: Deploy ArgoCD via Helm
  when: argocd_install_method == 'helm'
  kubernetes.core.helm:
    state: present
    release_name: argocd
    chart_ref: argo/{{ argocd_helm_chart }}
    namespace: "{{ argocd_namespace }}"
    kubeconfig: "{{ argocd_context_kubeconfig }}"
    create_namespace: false
    chart_version: "{{ argocd_version }}"
    values: "{{ argocd_helm_values | default({}) }}"

- name: Ensure ArgoCD server service is exposed via NodePort
  when: argocd_nodeport_enabled
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ argocd_context_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: argocd-server
        namespace: "{{ argocd_namespace }}"
        labels:
          app.kubernetes.io/name: argocd-server
          app.kubernetes.io/component: server
      spec:
        type: NodePort
        selector:
          app.kubernetes.io/name: argocd-server
          app.kubernetes.io/component: server
        ports:
          - port: 80
            targetPort: 8080
            nodePort: "{{ argocd_nodeport_http_port }}"
            name: http
          - port: 443
            targetPort: 8080
            nodePort: "{{ argocd_nodeport_https_port }}"
            name: https
