---
- name: Ensure ArgoCD namespace exists
  kubernetes.core.k8s:
    state: present
    kind: Namespace
    name: "{{ argocd_namespace }}"
    kubeconfig: "{{ argocd_context_kubeconfig }}"

- name: Add Argo Helm repository
  kubernetes.core.helm_repository:
    name: argo
    repo_url: "{{ argocd_helm_repo }}"

- name: Require the admin password hash
  # Before the Helm deploy, so a missing hash fails here with an actionable
  # message rather than producing a working ArgoCD whose password is a random
  # string in argocd-initial-admin-secret.
  when: argocd_install_method == 'helm'
  ansible.builtin.assert:
    that:
      - argocd_admin_password_hash is defined
      - argocd_admin_password_hash | length > 0
      - argocd_admin_password_hash[:4] in ['$2a$', '$2b$']
    fail_msg: >-
      argocd_admin_password_hash must be set in ansible/secret.yaml to a
      bcrypt hash beginning $2a$ or $2b$ -- ArgoCD uses Go's bcrypt, which
      accepts those two and rejects the $2y$ that htpasswd emits. htpasswd:
      htpasswd -nbBC 10 "" 'pw' | tr -d ':\n' | sed 's/$2y/$2a/'  --  python:
      python3 -c "import bcrypt;print(bcrypt.hashpw(b'pw',bcrypt.gensalt(10)).decode())"

- name: Create the AVP plugin ConfigMap
  # Before the Helm deploy, deliberately. repo-server mounts this; when it
  # does not exist kubelet loops on MountVolume.SetUp and the pod never
  # leaves Init. That is what removed argocd-vault-plugin the first time.
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ argocd_context_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: cmp-plugin
        namespace: "{{ argocd_namespace }}"
      data:
        avp.yaml: |
          apiVersion: argoproj.io/v1alpha1
          kind: ConfigManagementPlugin
          metadata:
            name: argocd-vault-plugin
          spec:
            allowConcurrency: true
            discover:
              find:
                command:
                  - sh
                  - "-c"
                  - "find . -name '*.yaml' | xargs -I {} grep -l '<path:' {} | head -1"
            generate:
              command:
                - sh
                - "-c"
                # Naming a plugin on an Application makes ArgoCD delegate ALL
                # manifest generation to this CMP -- kustomize no longer runs
                # on ArgoCD's side. Task 6 sets spec.source.plugin on the
                # jobboard Application, whose path is the kustomize overlay
                # argocd/apps/jobboard/dev, so a bare `generate ./` would read
                # the raw overlay files and kustomization.yaml itself as
                # manifests instead of rendering the overlay. Pipe through
                # kustomize first when the source is an overlay; the sidecar
                # image (quay.io/argoproj/argocd) ships a kustomize binary.
                # The conditional keeps plain-YAML sources working too.
                - "if [ -f kustomization.yaml ]; then kustomize build . | argocd-vault-plugin generate -; else argocd-vault-plugin generate ./; fi"
            lockRepo: false

- name: Create the AVP configuration Secret
  # Under Kubernetes auth this holds no credential -- only an address and a
  # role name. It is a Secret because AVP expects to read it as one.
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ argocd_context_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-vault-plugin-config
        namespace: "{{ argocd_namespace }}"
      type: Opaque
      stringData:
        AVP_TYPE: vault
        AVP_AUTH_TYPE: k8s
        AVP_K8S_ROLE: argocd
        VAULT_ADDR: "http://{{ argocd_vault_address }}:8200"

- name: Deploy ArgoCD via Helm
  when: argocd_install_method == 'helm'
  kubernetes.core.helm:
    state: present
    release_name: argocd
    chart_ref: argo/{{ argocd_helm_chart }}
    namespace: "{{ argocd_namespace }}"
    kubeconfig: "{{ argocd_context_kubeconfig }}"
    create_namespace: false
    chart_version: "{{ argocd_version }}"
    values: "{{ argocd_helm_values | default({}) }}"

- name: Ensure ArgoCD server service is exposed via NodePort
  when: argocd_nodeport_enabled
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ argocd_context_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: argocd-server
        namespace: "{{ argocd_namespace }}"
        labels:
          app.kubernetes.io/name: argocd-server
          app.kubernetes.io/component: server
      spec:
        type: NodePort
        selector:
          app.kubernetes.io/name: argocd-server
          app.kubernetes.io/component: server
        ports:
          - port: 80
            targetPort: 8080
            nodePort: "{{ argocd_nodeport_http_port }}"
            name: http
          - port: 443
            targetPort: 8080
            nodePort: "{{ argocd_nodeport_https_port }}"
            name: https
