---
- name: Retrieve join command from control plane host
  ansible.builtin.set_fact:
    node_join_command: "{{ hostvars[groups['k8s_control_plane'][0]].control_plane_worker_join }}"
  when: hostvars[groups['k8s_control_plane'][0]].get('control_plane_worker_join') is defined

- name: Fail clearly if join command absent
  ansible.builtin.fail:
    msg: "Join command not available. Run the control_plane role first."
  when: node_join_command is not defined

- name: Wait for API server to be reachable
  ansible.builtin.wait_for:
    host: "{{ control_plane_endpoint | default(hostvars[groups['k8s_control_plane'][0]].ansible_host) }}"
    port: "{{ kube_apiserver_port }}"
    timeout: 120

- name: Check if node already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: node_join_kubelet_conf

- name: Join node to cluster
  ansible.builtin.command: "{{ node_join_command }} --node-name {{ inventory_hostname }}"
  when: not node_join_kubelet_conf.stat.exists
  changed_when: true

- name: Ensure kubelet is running
  ansible.builtin.service:
    name: kubelet
    state: started
    enabled: true
