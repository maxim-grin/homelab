---
- name: Install NFS client packages
  ansible.builtin.apt:
    name:
      - nfs-common
    state: present
    update_cache: true

- name: Test NFS mount accessibility
  ansible.builtin.command: "showmount -e {{ nfs_server }}"
  register: nfs_client_test
  changed_when: false
  failed_when: false

- name: Display NFS mounts available
  ansible.builtin.debug:
    msg: "{{ nfs_client_test.stdout_lines }}"
  when: nfs_client_test.rc == 0

- name: Warn if NFS server is unreachable
  ansible.builtin.debug:
    msg: "WARNING: Cannot reach NFS server {{ nfs_server }}. Check connectivity and NFS server configuration."
  when: nfs_client_test.rc != 0
