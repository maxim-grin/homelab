---
# Every vault_k8s_clusters entry must carry all of these. Not a default:
# nothing about it is tunable. Each entry also carries exactly one of
# vault_k8s_cluster_sources, which says how the role reaches the cluster.
vault_k8s_cluster_keys:
  - name
  - kv_mount
  - auth_path
  - api_host
  - policy_name
  - role_name
  - service_account_names
  - service_account_namespaces

vault_k8s_cluster_sources:
  - control_plane_host
  - kubeconfig
