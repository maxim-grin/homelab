---
- name: Require every cluster entry to carry every key
  ansible.builtin.assert:
    that:
      - vault_k8s_cluster_keys | difference(item.keys() | list) | length == 0
    fail_msg: >-
      vault_k8s_clusters entry {{ item.name | default(ansible_loop.index) }}
      is missing {{ vault_k8s_cluster_keys | difference(item.keys() | list) | join(', ') }}.
    quiet: true
  loop: "{{ vault_k8s_clusters }}"
  loop_control:
    extended: true
    label: "{{ item.name | default(ansible_loop.index) }}"

# Two ways to reach a cluster: SSH to a kubeadm control plane, or a
# kubeconfig on the workstation for Talos, which has no SSH. Neither or
# both leaves the role guessing which credentials to trust.
- name: Require every cluster entry to name exactly one way in
  ansible.builtin.assert:
    that:
      - vault_k8s_cluster_sources | select('in', item.keys() | list) | list | length == 1
    fail_msg: >-
      vault_k8s_clusters entry {{ item.name | default(ansible_loop.index) }}
      must set exactly one of {{ vault_k8s_cluster_sources | join(' or ') }};
      it sets {{ vault_k8s_cluster_sources | select('in', item.keys() | list) | join(' and ') | default('neither', true) }}.
    quiet: true
  loop: "{{ vault_k8s_clusters }}"
  loop_control:
    extended: true
    label: "{{ item.name | default(ansible_loop.index) }}"

- name: Require every selected cluster to be in vault_k8s_clusters
  ansible.builtin.assert:
    that:
      - vault_k8s_cluster_names is not string
      - vault_k8s_cluster_names | difference(vault_k8s_clusters | map(attribute='name')) | length == 0
    fail_msg: >-
      vault_k8s_cluster_names
      {{ 'is a string, not a list' if vault_k8s_cluster_names is string
      else 'names ' ~ (vault_k8s_cluster_names | difference(vault_k8s_clusters | map(attribute='name')) | join(', '))
      ~ ', which vault_k8s_clusters does not have' }}.
      Pass it as JSON, e.g. -e '{"vault_k8s_cluster_names":["dev"]}'.
      Valid names: {{ vault_k8s_clusters | map(attribute='name') | join(', ') }}.
    quiet: true

# The kubeconfig is checked here, before anything writes to Vault, rather
# than when its cluster's turn comes: an empty path would otherwise reach
# kubernetes.core, which can fall back to ~/.kube/config and read
# another cluster's Secret. Only selected clusters are checked, so a run
# for dev alone needs no prod kubeconfig.
- name: Require every selected kubeconfig to be a file on the workstation
  ansible.builtin.assert:
    that:
      - item.kubeconfig | length > 0
      - item.kubeconfig | expanduser is file
    fail_msg: >-
      vault_k8s_clusters entry {{ item.name }} reads its cluster through a
      kubeconfig, and {{ item.kubeconfig | default('', true) | quote }} is
      not a file on this machine. For prod, write terraform output -raw
      kubeconfig from terraform/environments/prod to a temporary file and
      pass -e vault_prod_kubeconfig=<that file>. If this run is meant for
      some clusters only, name them, e.g.
      -e '{"vault_k8s_cluster_names":["dev"]}'.
    quiet: true
  loop: >-
    {{ vault_k8s_clusters | selectattr('name', 'in', vault_k8s_cluster_names)
       | selectattr('kubeconfig', 'defined') }}
  loop_control:
    label: "{{ item.name }}"
  when: vault_configure | bool and vault_configure_k8s_auth | bool

- name: Refuse two clusters sharing an auth_path
  ansible.builtin.assert:
    that:
      - vault_k8s_clusters | map(attribute='auth_path') | unique | length == vault_k8s_clusters | length
    fail_msg: >-
      Two vault_k8s_clusters entries share an auth_path. The second would
      overwrite the first's kubernetes_host, pointing one cluster's ArgoCD
      at the other's API server.

- name: Refuse two clusters sharing a policy_name
  ansible.builtin.assert:
    that:
      - vault_k8s_clusters | map(attribute='policy_name') | unique | length == vault_k8s_clusters | length
    fail_msg: >-
      Two vault_k8s_clusters entries share a policy_name. The second's
      policy would overwrite the first's, granting one cluster's ArgoCD
      the other's kv_mount.

- name: Refuse two clusters sharing a kv_mount
  ansible.builtin.assert:
    that:
      - vault_k8s_clusters | map(attribute='kv_mount') | unique | length == vault_k8s_clusters | length
    fail_msg: >-
      Two vault_k8s_clusters entries share a kv_mount, so each cluster's
      policy would grant it the other's secrets.

- name: Require every cluster's kv_mount to be one this role creates
  ansible.builtin.assert:
    that:
      - vault_k8s_clusters | map(attribute='kv_mount') | difference(vault_kv_mounts) | length == 0
    fail_msg: >-
      A vault_k8s_clusters kv_mount is not in vault_kv_mounts:
      {{ vault_k8s_clusters | map(attribute='kv_mount') | difference(vault_kv_mounts) | join(', ') }}.

- name: Require every extra_kv_mounts entry to be a created mount, not the cluster's own
  ansible.builtin.assert:
    that:
      - item.extra_kv_mounts | default([]) is not string
      - item.extra_kv_mounts | default([]) | difference(vault_kv_mounts) | length == 0
      - item.kv_mount not in item.extra_kv_mounts | default([])
    fail_msg: >-
      vault_k8s_clusters entry {{ item.name }} has a bad extra_kv_mounts:
      every entry must be in vault_kv_mounts
      ({{ vault_kv_mounts | join(', ') }}) and must not repeat its own
      kv_mount ({{ item.kv_mount }}). It lists
      {{ item.extra_kv_mounts | default([]) }}.
    quiet: true
  loop: "{{ vault_k8s_clusters }}"
  loop_control:
    label: "{{ item.name | default('?') }}"
