---
- name: Require a Vault token
  ansible.builtin.assert:
    that:
      - vault_token is defined
      - vault_token | length > 0
    fail_msg: >-
      Pass the Vault root token for this run: -e vault_token=...
      It is deliberately absent from secret.yaml and from role defaults.

- name: Enable the KV v2 secrets engine
  ansible.builtin.uri:
    url: "http://{{ ansible_facts['default_ipv4']['address'] }}:{{ vault_api_port }}/v1/sys/mounts/secret"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_token }}"
    body_format: json
    body:
      type: kv
      options:
        version: "2"
    # Vault answers 204 when it has nothing to say and 200 with a JSON body
    # when it has a warning to report -- creating the role without an
    # `audience` is one such warning. Asserting 204 alone turns a successful
    # write into a failed task, which is how this first surfaced: the role was
    # created and the play stopped anyway.
    status_code: [200, 204, 400]
  register: vault_kv_mount
  changed_when: vault_kv_mount.status in [200, 204]
  # 400 is "path is already in use", which is success on a re-run.

- name: Seed the KV paths
  ansible.builtin.uri:
    url: >-
      http://{{ ansible_facts['default_ipv4']['address'] }}:{{ vault_api_port }}/v1/secret/data/{{ vault_kv_prefix }}/{{ item.key }}
    method: POST
    headers:
      X-Vault-Token: "{{ vault_token }}"
    body_format: json
    body:
      data: "{{ item.value }}"
    status_code: 200
  loop: "{{ vault_kv | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
