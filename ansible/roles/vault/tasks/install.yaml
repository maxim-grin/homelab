---
- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - gpg
      - coreutils
    state: present
    update_cache: true

- name: Download the HashiCorp GPG key
  ansible.builtin.get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: /tmp/hashicorp.asc
    mode: "0644"

- name: Dearmor the HashiCorp GPG key
  ansible.builtin.command:
    cmd: gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg /tmp/hashicorp.asc
    creates: /usr/share/keyrings/hashicorp-archive-keyring.gpg

- name: Install python3-debian for deb822_repository
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: Add the HashiCorp repository
  ansible.builtin.deb822_repository:
    name: hashicorp
    types: [deb]
    uris: https://apt.releases.hashicorp.com
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [main]
    signed_by: /usr/share/keyrings/hashicorp-archive-keyring.gpg
    state: present

# apt_repository chose its own .list filename here (on vault-01 it is
# apt_releases_hashicorp_com.list), so find the old file by content instead
# of guessing its name. find anchors `contains` at the start of each line,
# and the repository line starts with `deb [signed-by=...`, so the leading
# `.*` is what makes this match at all.
- name: Find the old one-line HashiCorp repository files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: "*.list"
    contains: '.*apt\.releases\.hashicorp\.com'
  register: vault_old_hashicorp_lists

- name: Remove the old one-line HashiCorp repository files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ vault_old_hashicorp_lists.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Install Vault
  ansible.builtin.apt:
    name: "vault={{ vault_version }}"
    state: present
    update_cache: true

- name: Hold Vault at the pinned version
  # apt upgrade -- unattended or by hand -- would otherwise walk this across a
  # major version without anyone choosing to. Vault's file storage does not
  # downgrade, so the hold is the cheap half of that bargain.
  ansible.builtin.dpkg_selections:
    name: vault
    selection: hold

- name: Create the Vault directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: vault
    group: vault
    mode: "0755"
  loop:
    - "{{ vault_config_dir }}"
    - "{{ vault_data_dir }}"

- name: Render the Vault configuration
  ansible.builtin.template:
    src: vault.hcl.j2
    dest: "{{ vault_config_dir }}/vault.hcl"
    owner: vault
    group: vault
    mode: "0640"
  notify: Restart vault

- name: Create the vault.service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/vault.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Drop the capability directives the container cannot grant
  # The packaged vault.service sets AmbientCapabilities=CAP_IPC_LOCK,
  # SecureBits=keep-caps and LimitMEMLOCK=infinity. systemd raises those at
  # exec, BEFORE Vault reads its config -- so disable_mlock = true does not
  # help: if this unprivileged container's bounding set lacks CAP_IPC_LOCK the
  # unit dies with 231/CAPABILITIES and an error that never mentions mlock.
  # disable_mlock makes them pointless anyway, so clearing them costs nothing.
  ansible.builtin.copy:
    dest: /etc/systemd/system/vault.service.d/10-no-mlock.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      AmbientCapabilities=
      SecureBits=
      CapabilityBoundingSet=CAP_SYSLOG
      LimitMEMLOCK=
  notify: Restart vault

- name: Enable and start Vault
  ansible.builtin.systemd_service:
    name: vault
    enabled: true
    state: started
    daemon_reload: true
