---
vault_data_dir: /opt/vault/data
vault_config_dir: /etc/vault.d
vault_listen_address: "0.0.0.0:8200"
vault_api_port: 8200
# Pinned deliberately. This role first ran with a bare `vault` package name and
# apt served 2.1.0-1, where the plan had recorded 1.10.0 verified three days
# earlier -- a major version crossed unnoticed, against `file` storage that does
# not downgrade. It happened to work. A rebuild months from now would take
# whatever is current then and meet the same surprise with real data underneath.
#
# Bumping is a deliberate act: read `apt-cache madison vault` on vault-01, set
# the version here, then `dpkg --set-selections` to unhold before re-running --
# the role holds the package so an unattended `apt upgrade` cannot move it.
#
# If a rebuild fails with "Version '...' for 'vault' was not found", HashiCorp
# has dropped that build from the index. Pick the closest available from
# `apt-cache madison vault` and record why here.
vault_version: "2.1.0-1"

vault_seed: false
vault_configure_k8s_auth: false

# One entry per cluster that authenticates against this Vault. Only dev
# exists; the prod entry (auth_path: kubernetes-prod, its own api_host and
# control_plane_host, policy_name: argocd-read-prod) arrives with the prod
# cluster, against an API server that exists to be configured.
#
# dev's auth_path, policy_name and role_name are the values Vault already
# holds and argocd-vault-plugin already uses. Changing them means
# reconfiguring AVP's Secret, which this role does not do.
vault_k8s_clusters:
  - name: dev
    auth_path: kubernetes
    api_host: "{{ host_ips['master-01'] }}"
    control_plane_host: master-01
    policy_name: argocd-read
    role_name: argocd
    service_account_names: ["argocd-repo-server"]
    service_account_namespaces: ["argocd"]

# Secrets are namespaced per environment so one Vault can serve both
# clusters: dev's live under secret/dev/, prod's under secret/prod/, and each
# cluster's policy grants only its own prefix. The keys in secret.yaml's
# vault_kv block stay unprefixed -- that file is ansible-vault ciphertext and
# does not need editing to add an environment.
vault_kv_prefix: dev
