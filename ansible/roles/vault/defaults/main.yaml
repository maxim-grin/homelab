---
vault_data_dir: /opt/vault/data
vault_config_dir: /etc/vault.d
vault_listen_address: "0.0.0.0:8200"
vault_api_port: 8200
# Pinned deliberately. This role first ran with a bare `vault` package name and
# apt served 2.1.0-1, where the plan had recorded 1.10.0 verified three days
# earlier -- a major version crossed unnoticed, against `file` storage that does
# not downgrade. It happened to work. A rebuild months from now would take
# whatever is current then and meet the same surprise with real data underneath.
#
# Bumping is a deliberate act: read `apt-cache madison vault` on vault-01, set
# the version here, then `dpkg --set-selections` to unhold before re-running --
# the role holds the package so an unattended `apt upgrade` cannot move it.
#
# If a rebuild fails with "Version '...' for 'vault' was not found", HashiCorp
# has dropped that build from the index. Pick the closest available from
# `apt-cache madison vault` and record why here.
vault_version: "2.1.0-1"

vault_seed: false
vault_configure_k8s_auth: false
